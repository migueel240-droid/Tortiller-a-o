<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#164a85">
<meta name="description" content="Ventas e inventario de Tortillería Obregón">
<link rel="manifest" href="manifest.json">
<title>Tortillería Obregón</title>
<style>
:root{--blue:#164a85;--blue2:#2169ad;--yellow:#ffd52a;--bg:#f2f6fb;--ink:#172b43;--muted:#66778c;--line:#dce5ef;--white:#fff;--red:#bd3535;--green:#16804a}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 14px;font-weight:700}.primary{background:var(--yellow);color:#183b65}.bluebtn{background:var(--blue);color:#fff}.secondary{background:#e7eef7;color:var(--blue)}.danger{background:#fde8e8;color:var(--red)}.muted{color:var(--muted)}.small{font-size:.85rem}.app-header{background:var(--blue);color:white;padding:18px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #12385a25}.brand{display:flex;align-items:center;gap:12px}.logo{height:44px;width:44px;background:white;color:var(--blue);border-radius:13px;display:grid;place-items:center;font-size:24px;font-weight:900}.brand h1{font-size:1.1rem;margin:0}.brand p{font-size:.8rem;margin:2px 0 0;color:#dceaff}.container{max-width:760px;margin:0 auto;padding:14px 14px 100px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 7px #183b6508}.stat{font-size:1.5rem;font-weight:800;color:var(--blue)}.section-title{font-size:1.15rem;margin:8px 0 12px}.menu-card{display:flex;flex-direction:column;gap:8px;min-height:106px;text-align:left;background:#fff;border:1px solid var(--line);color:var(--blue)}.menu-card .ico{font-size:1.55rem}.menu-card span:last-child{font-size:.82rem;color:var(--muted);font-weight:500}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:.86rem;font-weight:700;color:#3b4f65}.field input,.field select,.field textarea,input.search{width:100%;border:1px solid #cbd8e6;border-radius:10px;padding:11px;background:#fff;color:var(--ink);min-width:0}.inline-field{display:flex;gap:8px;align-items:center}.inline-field>*{flex:1;min-width:0}.item{display:flex;gap:10px;align-items:center}.item+.item{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.item-photo{width:54px;height:54px;flex-shrink:0;border-radius:12px;object-fit:cover;background:#edf2f8;display:grid;place-items:center;font-size:24px}.item-main{flex:1;min-width:0}.item-main strong{display:block}.item-main small{color:var(--muted)}.price{font-weight:800;color:var(--blue);white-space:nowrap}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:6px 10px;border-radius:9px;background:#e7eef7;color:var(--blue)}.qty input{width:60px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:7px}.pill{font-size:.75rem;border-radius:99px;padding:4px 8px;background:#e7eef7;color:var(--blue);display:inline-block}.pill.green{background:#e3f6ea;color:var(--green)}.pill.red{background:#fde8e8;color:var(--red)}.pill.yellow{background:#fff4bf;color:#725400}.totalrow{display:flex;justify-content:space-between;padding:6px 0}.totalrow.total{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-size:1.2rem;font-weight:800;color:var(--blue)}.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.bottom-nav button{background:transparent;color:var(--muted);padding:5px 8px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:3px}.bottom-nav button b{font-size:1.25rem}.bottom-nav button.active{color:var(--blue)}.bottom-nav .navnew{background:var(--yellow);color:#183b65;border-radius:12px;padding:6px 12px}.hidden{display:none!important}.notice{padding:11px;border-radius:10px;background:#fff4bf;color:#654f00;font-size:.85rem;margin-bottom:12px}.empty{text-align:center;padding:24px;color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.toolbar>*{flex:1}.divider{height:1px;background:var(--line);margin:12px 0}.tablelike{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.tablelike:last-child{border:0}.danger-text{color:var(--red)}.photo-preview{width:64px;height:64px;border-radius:12px;object-fit:cover}.role-badge{margin-top:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}.logout{background:#ffffff20;color:white;padding:7px 10px}.sticky-action{position:sticky;bottom:75px;background:var(--bg);padding:8px 0}.tabs{display:flex;gap:8px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap;background:#e7eef7;color:var(--blue);padding:9px 12px}.tabs button.active{background:var(--blue);color:#fff}@media(min-width:600px){.container{padding-top:22px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header class="app-header">
  <div class="brand"><div class="logo">O</div><div><h1>Tortillería Obregón</h1><p id="headerSubtitle">Ventas e inventario</p></div></div>
  <div class="role-badge"><span id="roleLabel" class="small">Modo administrador</span><button class="logout" id="switchRole">Cambiar acceso</button></div>
</header>
<main id="app" class="container"></main>
<nav class="bottom-nav" id="nav"></nav>
<input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment">
<script src="app.js"></script>
</body>
</html>
